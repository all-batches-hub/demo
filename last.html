<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3 of 3 - Get Link</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .timer-box { font-size: 28px; font-weight: bold; color: #dc3545; margin: 20px 0; }
        .btn { display: inline-block; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background-color: #dc3545; border: none; border-radius: 6px; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .btn:disabled, .btn.disabled { background-color: #cccccc; cursor: not-allowed; pointer-events: none; }
        .btn:hover:not(:disabled) { background-color: #bd2130; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Final Step 3 / 3</h2>
        <p>Aapka original link ready ho raha hai.</p>
        
        <div class="timer-box" id="timer">10</div>

        <a id="continueBtn" class="btn disabled" href="#">PLEASE WAIT...</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedDest = urlParams.get('dest');
        
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const continueBtn = document.getElementById('continueBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "Ready!";
                continueBtn.classList.remove('disabled');
                continueBtn.innerText = "GET DESTINATION LINK";

                if (encodedDest) {
                    try {
                        // Original Base64 URL decode karke actual link assign kar rahe hain
                        const originalUrl = decodeURIComponent(atob(encodedDest));
                        continueBtn.href = originalUrl;
                    } catch (e) {
                        console.error("Invalid base64 URL format", e);
                        continueBtn.innerText = "INVALID LINK";
                    }
                }
            }
        }, 1000);
    </script>

</body>
</html>
