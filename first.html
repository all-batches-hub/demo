<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1 of 3 - Link Shortener</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h2 { margin-bottom: 10px; color: #333; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .timer-box { font-size: 28px; font-weight: bold; color: #007bff; margin: 20px 0; }
        .btn { display: inline-block; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background-color: #007bff; border: none; border-radius: 6px; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .btn:disabled, .btn.disabled { background-color: #cccccc; cursor: not-allowed; pointer-events: none; }
        .btn:hover:not(:disabled) { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Step 1 / 3</h2>
        <p>Kripya aage badhne ke liye timer khatam hone ka intezar karein.</p>
        
        <div class="timer-box" id="timer">10</div>

        <a id="continueBtn" class="btn disabled" href="#">PLEASE WAIT...</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encodedDest = urlParams.get('dest');
        
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const continueBtn = document.getElementById('continueBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "Done!";
                continueBtn.classList.remove('disabled');
                continueBtn.innerText = "CONTINUE TO STEP 2";

                if (encodedDest) {
                    continueBtn.href = `second.html?dest=${encodedDest}`;
                }
            }
        }, 1000);
    </script>

</body>
</html>
